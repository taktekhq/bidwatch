<html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"jobs": [{"__typename": "Job", "content": "<p>Please refer to the attached PDF.</p>\n", "id": "cG9zdDoxOTY2MTA=", "date": "2026-10-01T10:43:15", "slug": "contract-salesforce-administrator", "jobFields": {"__typename": "Job_Jobfields", "organization": "Black Clergy Collaborative of Memphis", "howToApply": null, "jobCityregion": null, "salary": null, "salaryRangeEnd": "34", "salaryRangeStart": "29", "twitterHandle": null, "websiteUrl": "https://blackclergycollaborative.org/", "pdfName": "https://upcdn.io/kW15bXk/raw/RFPs/001UV00000toMfBYAU-1790865643352.pdf"}, "jobFunctions": {"__typename": "JobToJobFunctionConnection", "nodes": [{"__typename": "JobFunction", "name": "Other", "slug": "other"}]}, "jobIndustries": {"__typename": "JobToJobIndustryConnection", "nodes": [{"__typename": "JobIndustry", "name": "Other", "slug": "other"}]}, "jobLocations": {"__typename": "JobToJobLocationConnection", "nodes": [{"__typename": "JobLocation", "name": "Tennessee", "slug": "tennessee"}]}, "jobTypes": {"__typename": "JobToJobTypeConnection", "nodes": [{"__typename": "JobType", "name": "Contract", "slug": "contract"}]}, "salaryTypes": {"__typename": "JobToSalaryTypeConnection", "nodes": [{"__typename": "SalaryType", "name": "Hourly", "slug": "hourly"}]}, "title": "Contract Salesforce Administrator", "listingTypes": {"__typename": "JobToListingTypeConnection", "nodes": [{"__typename": "ListingType", "name": "RFP", "slug": "rfp"}]}}, {"__typename": "Job", "content": "<h1>About Us</h1>\n<p></p>\n<p>Charity Navigator is the world&#8217;s largest and most-utilized independent nonprofit evaluator. The organization guides informed giving by evaluating the financial health, accountability, transparency, and impact of charities and provides data on over 245,000 nonprofits. As a 501(c)(3) public charity itself, Charity Navigator depends on support from individuals, corporations, and foundations to provide this trusted data free of charge to the public.</p>\n<h1>The Role</h1>\n<p></p>\n<p>You will build and ship production LLM-powered and agentic features that make 2.4 million nonprofit profiles easier to search, compare, and understand &#8211; so a donor gets a clear answer instead of a spreadsheet.</p>\n<p>This is application-layer work. You will partner with our existing engineering team rather than owning the pipelines yourself, so your time goes into the AI features people use.</p>\n<p>You will report to the VP of Engineering and work closely with them and other senior engineers on system design, technical direction, and strategic AI opportunities. You will own AI features from day one, with regular design review and hands-on guidance on the harder architectural calls, and take on more architectural ownership as you build depth in production AI systems.</p>\n<h1>What You&#8217;ll Do</h1>\n<p></p>\n<ol>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Build and ship production LLM-powered and agentic features &#8211; prompt orchestration, tool calling, embeddings, structured outputs &#8211; favoring reusable components over one-off solutions.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Build API Integrations, MCP servers, and retrieval-augmented generation (RAG) workflows that connect our existing data systems to vector search, so that AI features surface and explain our published ratings data accurately and cite the source of each figure.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Build and run evaluation infrastructure &#8211; prompt regression tests, LLM-as-a-judge evaluations, synthetic datasets &#8211; that catch feature quality regressions before users do.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Monitor AI features in production. Track accuracy, latency, token cost, and hallucination rates, then debug and tune prompts based on what you find.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Implement runtime safety and reliability guardrails that keep AI outputs within quality, compliance, and operational bounds.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Research and recommend orchestration frameworks, vector stores, and model providers, weighing cost and operational burden against speed. Final build-versus-buy calls are made jointly with the VP of Engineering.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Work directly with non-technical stakeholders to scope problems and give them honest assessments of what AI can and cannot do.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Evaluate emerging models and tools, use AI-assisted development extensively, and help raise team engineering standards through code review.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>What We Look For</li>\n</ol>\n<h1><strong>Experience</strong></h1>\n<ol>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>2-3+ years building or deploying machine learning models or AI-driven applications.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Education</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Bachelor\u2019s degree in Computer Science, Engineering, AI/ML, or a related field, or a relevant certificate program. Demonstrated technical proficiency and relevant industry experience will be considered in lieu of a formal degree.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Required</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Python and ML fundamentals. 2+ years of Python, professional or substantial project-based experience, with a solid grasp of core machine learning concepts and API integration.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>LLM and agentic systems. Hands-on experience with foundation model providers (Anthropic, OpenAI, and similar), prompt engineering, and agentic patterns &#8211; using orchestration frameworks such as LangChain or LlamaIndex, or integration standards such as the Model Context Protocol.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Retrieval and data integration. Practical experience querying and tuning a vector database (pgvector, OpenSearch, or similar) for RAG applications.</li>\n</ol>\n<h1>Nice to Have</h1>\n<ol>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Managed cloud AI services, such as Amazon Bedrock, are preferred.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Cloud deployment of application code via serverless or containerized patterns, AWS required.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Scrum or other Agile development experience.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Cloud, Gen AI, or machine learning certifications, such as AWS Certified Generative AI Developer, Certified Machine Learning, or Solutions Architect.</li>\n</ol>\n<h1>How You Work</h1>\n<ol>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Resourcefulness and adaptability. You learn quickly against unfamiliar problems, new ideas, and changing technology, and you find a way through when the obvious path is blocked.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Accountability and trust. Direct, truthful communication. You keep your commitments, admit mistakes and correct them, and give peers respectful, open-minded feedback.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Comfort with ambiguity. When requirements are incomplete or still moving, you surface the open questions early and bring options rather than assumptions.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Translation. You can explain what AI can and cannot do to people who do not build it, and turn their problems into a technical scope, in both directions.</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Coachability. You seek feedback and apply it quickly. You treat design and code review as a learning loop rather than a checkpoint to clear, and you are comfortable saying \u201cI don&#8217;t know yet\u201d and going to find out.</li>\n</ol>\n<p><strong>Location &amp; Work Environment</strong></p>\n<p>This position is fully remote within the United States, requiring a quiet, professional home setup for video collaboration. Computer provided.  Occasional travel to team retreats or key strategic meetings may be required.</p>\n<p><strong>Compensation &amp; Benefits</strong></p>\n<p>Salary Range: Our expected hiring range for this role is $105,000 \u2013 $125,000, with actual placement depending on experience, skill alignment, and qualifications. Because this is a new role for our team, we remain flexible for exceptional candidates whose background exceeds our core requirements.</p>\n<p><strong>Standard Benefits Package:</strong></p>\n<ol>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Health, Dental, and Vision Insurance (including coverage for dependents)</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Life &amp; Disability Insurance</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>20 vacation days, 10 sick days, 11 paid holidays in your first year</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Retirement savings with up to 3% match of base salary</li>\n<li data-list=\"bullet\"><span class=\"ql-ui\"></span>Flexible spending and dependent care accounts</li>\n</ol>\n<p><strong> </strong></p>\n<p>Equal Opportunity Employer: Charity Navigator provides equal employment opportunities to all employees and applicants for employment regardless of their race, color, creed, religion, sex, gender, disability, genetics, or any other characteristics protected by federal, state, or local law.</p>\n<p>Work Authorization: Only candidates who are legally authorized to work in the United States (and currently residing in the US) should apply.</p>\n", "id": "cG9zdDoxOTY2OTE=", "date": "2026-10-08T13:33:54", "slug": "ai-engineer", "jobFields": {"__typename": "Job_Jobfields", "organization": "Charity Navigator", "howToApply": null, "jobCityregion": null, "salary": null, "salaryRangeEnd": "125000", "salaryRangeStart": "105000", "twitterHandle": null, "websiteUrl": "https://www.charitynavigator.org/", "pdfName": null}, "jobFunctions": {"__typename": "JobToJobFunctionConnection", "nodes": [{"__typename": "JobFunction", "name": "Information Technology", "slug": "information-technology"}]}, "jobIndustries": {"__typename": "JobToJobIndustryConnection", "nodes": [{"__typename": "JobIndustry", "name": "Other", "slug": "other"}]}, "jobLocations": {"__typename": "JobToJobLocationConnection", "nodes": [{"__typename": "JobLocation", "name": "-Remote", "slug": "remote"}]}, "jobTypes": {"__typename": "JobToJobTypeConnection", "nodes": [{"__typename": "JobType", "name": "Full-Time", "slug": "full-time"}]}, "salaryTypes": {"__typename": "JobToSalaryTypeConnection", "nodes": [{"__typename": "SalaryType", "name": "Yearly", "slug": "yearly"}]}, "title": "AI Engineer", "listingTypes": {"__typename": "JobToListingTypeConnection", "nodes": [{"__typename": "ListingType", "name": "Employment", "slug": "employment"}]}}]}}}</script></body></html>
